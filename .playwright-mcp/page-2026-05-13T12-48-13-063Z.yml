          - heading "VAT Calculation" [level=3] [ref=e116]
          - paragraph [ref=e117]: Automatic 15% SA VAT computation per transaction. Configure VAT per category. Export VAT Input and Output reports with date range filtering.
        - generic [ref=e119]:
