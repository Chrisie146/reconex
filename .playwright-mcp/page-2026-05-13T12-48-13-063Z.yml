        - heading "Common questions" [level=2] [ref=e431]
        - paragraph [ref=e432]: Everything you need to know about Reconex
      - generic [ref=e433]:
        - generic [ref=e435]:
          - button "Which banks are supported?" [ref=e436] [cursor=pointer]:
            - generic [ref=e437]: Which banks are supported?
            - img [ref=e439]
          - generic [ref=e442]: FNB, Standard Bank, ABSA, Capitec, Nedbank and Investec. The system auto-detects the bank from your file. For any other bank, you can manually map the columns using the built-in column mapping tool.
        - generic [ref=e444]:
          - button "What file formats can I upload?" [ref=e445] [cursor=pointer]:
            - generic [ref=e446]: What file formats can I upload?
            - img [ref=e448]
          - generic [ref=e450]: CSV files from any bank, and PDF statements (both digital and scanned). Scanned PDFs are processed using OCR with support for Afrikaans and English text. You can also define custom extraction regions for complex layouts.
        - generic [ref=e452]:
          - button "How does the auto-categorization work?" [ref=e453] [cursor=pointer]:
            - generic [ref=e454]: How does the auto-categorization work?
            - img [ref=e456]
          - generic [ref=e458]: A rule-based engine matches transaction descriptions against a built-in database of South African merchants and keywords. There are 15 default categories. You can create custom categories and rules, and the system learns from your corrections over time.
        - generic [ref=e460]:
          - button "Can I calculate VAT from my statements?" [ref=e461] [cursor=pointer]:
            - generic [ref=e462]: Can I calculate VAT from my statements?
            - img [ref=e464]
          - generic [ref=e466]: Yes. The system calculates 15% SA VAT per transaction automatically. You can configure which categories are VAT-applicable and set custom VAT rates. Export dedicated VAT Input and Output reports with date range filtering.
        - generic [ref=e468]:
          - button "What export formats are available?" [ref=e469] [cursor=pointer]:
            - generic [ref=e470]: What export formats are available?
            - img [ref=e472]
          - generic [ref=e474]: "Excel, PDF and CSV. Export options include: all transactions, monthly summaries, per-category breakdowns, accountant reports with executive summaries, and dedicated VAT reports."
        - generic [ref=e476]:
          - button "Can I manage multiple clients?" [ref=e477] [cursor=pointer]:
            - generic [ref=e478]: Can I manage multiple clients?
            - img [ref=e480]
          - generic [ref=e482]: Yes. Create separate clients within your account. Each client has isolated transactions, categories, rules, invoices and financial years. Switch between clients from the sidebar.
        - generic [ref=e484]:
          - button "Is my data secure?" [ref=e485] [cursor=pointer]:
            - generic [ref=e486]: Is my data secure?
            - img [ref=e488]
          - generic [ref=e490]: Your data is encrypted at rest and in transit. Authentication uses JWT tokens with bcrypt-hashed passwords. Password reset uses single-use tokens with rate limiting. Cloud storage supports S3, Azure Blob or Google Cloud.
        - generic [ref=e492]:
          - button "Is there a limit on uploads or transactions?" [ref=e493] [cursor=pointer]:
            - generic [ref=e494]: Is there a limit on uploads or transactions?
            - img [ref=e496]
          - generic [ref=e498]: The free plan has no limits on the number of statements or transactions you can process. CSV uploads support up to 5 MB and PDFs up to 10 MB per file.
        - generic [ref=e500]:
          - button "Can I match invoices to bank transactions?" [ref=e501] [cursor=pointer]:
            - generic [ref=e502]: Can I match invoices to bank transactions?
            - img [ref=e504]
          - generic [ref=e506]: Yes. Upload invoice PDFs and the system will auto-extract metadata and match them to bank transactions using supplier name similarity, amount matching and date proximity. You confirm or reject each match.
        - generic [ref=e508]:
          - button "What analytics are available?" [ref=e509] [cursor=pointer]:
            - generic [ref=e510]: What analytics are available?
            - img [ref=e512]
          - generic [ref=e514]: "The dashboard includes: daily cash flow / running balance charts, monthly income vs expense trends, category spending breakdowns, top merchant analysis with averages and counts, and auto-detected recurring transactions."
